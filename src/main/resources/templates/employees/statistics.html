<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê nhân viên</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 20px; }
        h2 { color: #555; margin-top: 30px; margin-bottom: 15px; }
        .btn-group { margin-bottom: 20px; display: flex; gap: 10px; }
        a.btn, button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-info:hover { background: #117a8b; }
        .summary { background: #f0f8ff; border-left: 4px solid #007bff; padding: 20px; margin-bottom: 20px; border-radius: 4px; }
        .summary-item { display: inline-block; margin-right: 40px; }
        .summary-label { color: #666; font-size: 12px; text-transform: uppercase; }
        .summary-value { font-size: 32px; font-weight: bold; color: #007bff; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #333; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #ddd; }
        tr:hover { background: #f9f9f9; }
        .empty-state { text-align: center; padding: 40px; color: #666; }
        .chart-container { margin-top: 30px; padding: 20px; background: #f9f9f9; border-radius: 4px; }
        .bar { background: #007bff; margin: 10px 0; border-radius: 4px; padding: 10px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .bar-label { flex: 1; }
        .bar-value { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Thống kê Nhân viên</h1>

        <div class="btn-group">
            <a href="/web/employees/list" class="btn btn-primary">📋 Danh sách nhân viên</a>
            <a href="/web/employees/add" class="btn btn-info">➕ Thêm nhân viên mới</a>
        </div>

        <div class="summary">
            <div class="summary-item">
                <div class="summary-label">Tổng số nhân viên</div>
                <div class="summary-value" th:text="${stats.totalEmployees}">0</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Số phòng ban</div>
                <div class="summary-value" th:text="${stats.departmentStatistics.size()}">0</div>
            </div>
        </div>

        <h2>Thống kê theo Phòng ban</h2>

        <table th:if="${stats.departmentStatistics != null && stats.departmentStatistics.size() > 0}">
            <thead>
                <tr>
                    <th>#ID</th>
                    <th>Tên Phòng ban</th>
                    <th>Số nhân viên</th>
                    <th>Tỷ lệ</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="dept : ${stats.departmentStatistics}">
                    <td th:text="${dept.departmentId}"></td>
                    <td th:text="${dept.departmentName}"></td>
                    <td th:text="${dept.employeeCount}"></td>
                    <td th:text="${#numbers.formatDecimal(dept.employeeCount * 100.0 / stats.totalEmployees, 1, 2)} + '%'"></td>
                </tr>
            </tbody>
        </table>

        <div class="empty-state" th:if="${stats.departmentStatistics == null || stats.departmentStatistics.size() == 0}">
            <p>Không có dữ liệu thống kê</p>
        </div>

        <div class="chart-container" th:if="${stats.departmentStatistics != null && stats.departmentStatistics.size() > 0 && stats.totalEmployees > 0}">
            <h2>Biểu đồ Nhân viên theo Phòng ban</h2>
            <div th:each="dept : ${stats.departmentStatistics}">
                <div class="bar" th:style="'width: ' + ${dept.employeeCount * 100.0 / stats.totalEmployees} + '%'">
                    <span class="bar-label" th:text="${dept.departmentName}"></span>
                    <span class="bar-value" th:text="${dept.employeeCount}"></span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
