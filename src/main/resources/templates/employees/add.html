<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm nhân viên mới</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #007bff; box-shadow: 0 0 5px rgba(0,123,255,0.3); }
        .error { color: #dc3545; font-size: 12px; margin-top: 3px; }
        .form-group.has-error input, .form-group.has-error select { border-color: #dc3545; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button, a { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; }
        .btn-primary { background: #007bff; color: white; flex: 1; }
        .btn-primary:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; color: white; flex: 1; }
        .btn-secondary:hover { background: #545b62; }
        .success-msg { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Thêm Nhân viên mới</h1>

        <form th:action="@{/web/employees/add}" th:object="${employee}" method="post">
            <div class="form-group" th:classappend="${#fields.hasErrors('ten') ? 'has-error' : ''}">
                <label for="ten">Tên nhân viên *</label>
                <input type="text" id="ten" name="ten" th:value="*{ten}" placeholder="Nhập tên nhân viên..." required>
                <span class="error" th:if="${#fields.hasErrors('ten')}" th:errors="*{ten}"></span>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('email') ? 'has-error' : ''}">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" th:value="*{email}" placeholder="nhân viên@company.com">
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label for="departmentId">Phòng ban</label>
                <select id="departmentId" name="departmentId">
                    <option value="">-- Chọn phòng ban --</option>
                    <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                </select>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">💾 Lưu</button>
                <a href="/web/employees/list" class="btn btn-secondary">❌ Hủy</a>
            </div>
        </form>
    </div>
</body>
</html>
